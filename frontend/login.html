<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-url" content="http://localhost:5000">
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="stargate_favicon.svg">
<link rel="icon" type="image/x-icon" href="stargate_favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #0F172A;
            --bg-surface: #111827;
            --bg-elevated: #1E293B;
            --border-muted: #1F2937;
            --accent-primary: #3B82F6;
            --accent-hover: #2563EB;
            --text-primary: #E5E7EB;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #34D399;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-icon .form-control {
            padding-left: 44px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Login</h1>
                <p>Enter your credentials</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Enter username"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter password"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn" id="login-btn">
                    <span id="login-btn-text">Login</span>
                    <span id="login-btn-spinner" class="spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Auth module -->
    <script src="auth.js"></script>

    <script>
        $(document).ready(function() {
            // Check if already authenticated
            if (Auth.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }

            // Handle form submission
            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val();
                
                if (!username || !password) {
                    showAlert('error', 'Please fill in all fields');
                    return;
                }

                // Disable form
                setFormLoading(true);

                // Attempt login
                Auth.login(username, password)
                    .then((response) => {
                        console.log('[Login] Login successful, response:', response);
                        showAlert('success', 'Login successful! Redirecting...');
                        // Force reload user data before redirect
                        if (response.user) {
                            Auth.saveUser(response.user);
                            console.log('[Login] User data saved:', response.user);
                        } else {
                            // Fetch user data if not in response
                            Auth.getCurrentUser().then((userData) => {
                                console.log('[Login] User data fetched:', userData);
                                Auth.saveUser(userData);
                            }).catch((error) => {
                                console.error('[Login] Failed to fetch user data:', error);
                            });
                        }
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 500);
                    })
                    .catch((error) => {
                        showAlert('error', error.message || 'Login error. Please check your credentials.');
                        setFormLoading(false);
                    });
            });

            // Enter key handling
            $('#username, #password').on('keypress', function(e) {
                if (e.which === 13) {
                    $('#login-form').submit();
                }
            });
        });

        function showAlert(type, message) {
            const alertContainer = $('#alert-container');
            const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
            
            alertContainer.html(
                `<div class="alert ${alertClass} show">${message}</div>`
            );

            // Auto-hide after 5 seconds
            setTimeout(() => {
                alertContainer.find('.alert').removeClass('show');
                setTimeout(() => {
                    alertContainer.empty();
                }, 300);
            }, 5000);
        }

        function setFormLoading(loading) {
            const btn = $('#login-btn');
            const btnText = $('#login-btn-text');
            const btnSpinner = $('#login-btn-spinner');
            
            if (loading) {
                btn.prop('disabled', true);
                btnText.hide();
                btnSpinner.show();
            } else {
                btn.prop('disabled', false);
                btnText.show();
                btnSpinner.hide();
            }
        }
    </script>
</body>
</html>
