<!DOCTYPE html>
<html lang="en" id="html-root" data-version="1.8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-url" content="http://localhost:5000">
    <title>User Profile</title>
    <link rel="icon" type="image/svg+xml" href="stargate_favicon.svg">
<link rel="icon" type="image/x-icon" href="stargate_favicon.ico">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-main: #0F172A;
            --bg-surface: #111827;
            --bg-elevated: #1E293B;
            --border-muted: #1F2937;
            --accent-primary: #3B82F6;
            --accent-hover: #2563EB;
            --text-primary: #E5E7EB;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
        }

        body {
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-header {
            margin-bottom: 32px;
        }

        .profile-header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .profile-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .profile-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-muted);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .profile-card h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-muted);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            width: 200px;
            flex-shrink: 0;
        }

        .info-value {
            font-size: 14px;
            color: var(--text-primary);
            flex: 1;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 8px;
            margin-bottom: 4px;
            background: rgba(59, 130, 246, 0.1);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #34D399;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .back-link i {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Back to main
        </a>

        <div class="profile-header">
            <h1>User Profile</h1>
            <p>Account management</p>
        </div>

        <!-- User Information Card -->
        <div class="profile-card">
            <h2>User Information</h2>
            <div id="user-info-container">
                <div class="info-row">
                    <div class="info-label">Username:</div>
                    <div class="info-value" id="user-username">Loading...</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Email:</div>
                    <div class="info-value" id="user-email">-</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Roles:</div>
                    <div class="info-value" id="user-roles">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="profile-card">
            <h2>Change Password</h2>
            <div id="alert-container"></div>
            <form id="change-password-form">
                <div class="form-group">
                    <label class="form-label" for="current-password">Current Password</label>
                    <input 
                        type="password" 
                        id="current-password" 
                        name="current-password" 
                        class="form-control" 
                        placeholder="Enter current password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="new-password">New Password</label>
                    <input 
                        type="password" 
                        id="new-password" 
                        name="new-password" 
                        class="form-control" 
                        placeholder="Enter new password"
                        required
                        minlength="6"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirm New Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        class="form-control" 
                        placeholder="Repeat new password"
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" class="btn" id="change-password-btn">
                    Change Password
                </button>
            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Auth module -->
    <script src="auth.js"></script>

    <script>
        $(document).ready(function() {
            // Check authentication
            if (!Auth.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            // Load user data
            loadUserData();

            // Handle password change form
            $('#change-password-form').on('submit', function(e) {
                e.preventDefault();
                
                const currentPassword = $('#current-password').val();
                const newPassword = $('#new-password').val();
                const confirmPassword = $('#confirm-password').val();

                if (!currentPassword || !newPassword || !confirmPassword) {
                    showAlert('error', 'Please fill in all fields');
                    return;
                }

                if (newPassword !== confirmPassword) {
                    showAlert('error', 'New passwords do not match');
                    return;
                }

                if (newPassword.length < 6) {
                    showAlert('error', 'Password must contain at least 6 characters');
                    return;
                }

                changePassword(currentPassword, newPassword);
            });
        });

        function loadUserData() {
            const userData = Auth.getUser();
            
            if (userData) {
                updateUserInfo(userData);
            } else {
                Auth.getCurrentUser().then(function(userData) {
                    Auth.saveUser(userData);
                    updateUserInfo(userData);
                }).catch(function(error) {
                    console.error('Failed to load user data:', error);
                    showAlert('error', 'Failed to load user data');
                });
            }
        }

        function updateUserInfo(userData) {
            $('#user-username').text(userData.username || '-');
            $('#user-email').text(userData.email || '-');
            
            const rolesContainer = $('#user-roles');
            if (userData.roles && userData.roles.length > 0) {
                rolesContainer.empty();
                userData.roles.forEach(function(role) {
                    rolesContainer.append(`<span class="badge">${role}</span>`);
                });
            } else {
                rolesContainer.text('No roles');
            }
        }

        function changePassword(currentPassword, newPassword) {
            const btn = $('#change-password-btn');
            btn.prop('disabled', true).text('Changing...');

            const token = Auth.getToken();
            const userData = Auth.getUser();
            const userId = userData?.user_id || userData?.id;

            if (!userId) {
                showAlert('error', 'Failed to determine user ID');
                btn.prop('disabled', false).text('Change Password');
                return;
            }

            $.ajax({
                url: `${Auth.getApiUrl()}/api/users/${userId}`,
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                data: JSON.stringify({
                    current_password: currentPassword,
                    password: newPassword
                }),
                success: function(response) {
                    showAlert('success', 'Password changed successfully');
                    $('#change-password-form')[0].reset();
                },
                error: function(xhr, status, error) {
                    const errorMessage = xhr.responseJSON?.message || xhr.responseJSON?.error || 'Failed to change password';
                    showAlert('error', errorMessage);
                },
                complete: function() {
                    btn.prop('disabled', false).text('Change Password');
                }
            });
        }

        function showAlert(type, message) {
            const alertContainer = $('#alert-container');
            const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
            
            alertContainer.html(
                `<div class="alert ${alertClass} show">${message}</div>`
            );

            setTimeout(() => {
                alertContainer.find('.alert').removeClass('show');
                setTimeout(() => {
                    alertContainer.empty();
                }, 300);
            }, 5000);
        }
    </script>
</body>
</html>
