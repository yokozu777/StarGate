# ============================================
# Описания переменных для веб-интерфейса
# Этот файл является эталонным шаблоном и не изменяется при сохранении
# ============================================

# Переменные для роли 00_init
initial_ssh_port: |
  SSH порт для первоначального подключения
  По умолчанию: 22

init_ssh_connect: |
  Метод первоначального подключения: 'password' или 'key'
  По умолчанию: password

initial_key_file: |
  Путь к SSH ключу для первоначального подключения
  Используется только если init_ssh_connect: key

initial_user: |
  Имя пользователя для первоначального подключения
  По умолчанию: root

initial_password: |
  Пароль для первоначального подключения
  ВАЖНО: Используйте ansible-vault для хранения паролей в продакшене!

# Переменные для роли 01_backup_etc
backup_etc: |
  Создать резервную копию /etc перед настройкой
  По умолчанию: false (резервная копия не создается)

# Переменные для роли 02_init_sshd
disable_root_login: |
  Отключить вход по root через SSH
  По умолчанию: false (root login разрешен)

disable_password_auth: |
  Отключить аутентификацию по паролю
  По умолчанию: false (парольная аутентификация разрешена)

change_default_ssh_port: |
  Изменить стандартный SSH порт (22)
  По умолчанию: false (порт не меняется)

new_ssh_port: |
  Новый SSH порт (используется только если change_default_ssh_port: true)
  Пример: 2222

# Переменные для роли 03_configure_users
system_user: |
  Имя системного пользователя (обязательная переменная)
  По умолчанию в роли: localuser

change_root_password: |
  Изменить пароль root
  По умолчанию: false (пароль root не меняется)

new_root_password: |
  Новый пароль для root (используется только если change_root_password: true)
  ВАЖНО: Используйте ansible-vault для хранения паролей в продакшене!

enable_system_user_password: |
  Включить установку пароля для system_user
  По умолчанию: false (пароль не устанавливается)

system_user_password: |
  Пароль для system_user (используется только если enable_system_user_password: true)
  ВАЖНО: Используйте ansible-vault для хранения паролей в продакшене!

pub_keys_folder: |
  Путь к папке с публичными SSH ключами для добавления пользователю
  По умолчанию: не определено (ключи не добавляются)
  Пример: "/path/to/keys" или "{{ playbook_dir }}/files/ssh_keys"

# Переменные для роли 04_configure_hostname
hostname: |
  Имя хоста системы
  По умолчанию: не определено (имя хоста не меняется)

# Переменные для роли 05_configure_sysctl_limits
copy_system_files: |
  Копировать системные файлы (sysctl.conf)
  По умолчанию: false (файлы не копируются)

configure_system_limits: |
  Настроить лимиты системы (file descriptors, threads)
  По умолчанию: false (лимиты не настраиваются)

# Переменные для роли 06_configure_kernel
configure_kernel_params: |
  Настроить параметры ядра (GRUB/EFI)
  По умолчанию: false (параметры ядра не настраиваются)

default_kernel_params: |
  Параметры ядра по умолчанию
  Формат: список строк с параметрами
  Пример: ["intel_iommu=on", "iommu=pt"]

amd_pstate: |
  Включить AMD P-State для управления частотой процессора
  По умолчанию: false

intel_pstate: |
  Включить Intel P-State для управления частотой процессора
  По умолчанию: false

pstate_performance: |
  Режим производительности для P-State
  По умолчанию: false

iommu_param: |
  Параметры IOMMU для виртуализации
  По умолчанию: не определено

change_smt: |
  Изменить настройки SMT (Simultaneous Multi-Threading)
  По умолчанию: false

smt: |
  Значение SMT (true/false)
  Используется только если change_smt: true

# Переменные для роли 07_configure_network
configure_network: |
  Настроить сетевые интерфейсы
  По умолчанию: false (сеть не настраивается)

network_interfaces: |
  Конфигурация сетевых интерфейсов
  Формат: список словарей с настройками интерфейсов
  Пример:
    - name: eth0
      ip: 192.168.1.100
      netmask: 255.255.255.0
      gateway: 192.168.1.1

network_config: |
  Дополнительная конфигурация сети
  Формат: словарь с настройками

disable_ipv6: |
  Отключить IPv6
  По умолчанию: false (IPv6 включен)

dns_servers: |
  DNS серверы для системы
  Формат: список IP адресов
  Пример: ["8.8.8.8", "8.8.4.4"]

# Переменные для роли 08_configure_locales
configure_locales: |
  Настроить локали для системы
  По умолчанию: false (локали не настраиваются)
  При установке в true локали будут настроены автоматически в зависимости от типа ОС

additional_locales: |
  Дополнительные локали для генерации (Ubuntu/Debian)
  Формат: список строк с локалями
  Пример: ["en_US.UTF-8 UTF-8", "ru_RU.UTF-8 UTF-8"]
  По умолчанию: не определено (локали не добавляются)
  Примечание: используется только для Ubuntu/Debian

default_locale: |
  Локаль по умолчанию для системы
  Формат: строка с локалью
  Пример: "en_US.UTF-8", "ru_RU.UTF-8"
  По умолчанию: не определено (используется en_US.UTF-8)
  Применяется автоматически в зависимости от типа ОС

# Переменные для роли 09_configure_bash
configure_bash: |
  Настроить Bash окружение
  По умолчанию: false (Bash не настраивается)

bash_history_size: |
  Размер истории команд Bash
  По умолчанию: не определено

custom_bash_prompt: |
  Кастомный промпт для Bash
  По умолчанию: не определено

# Переменные для роли 10_manage_services
services_to_disable: |
  Список сервисов для управления (включение/отключение)
  Формат: список словарей с полями name и disable
  Пример:
    - { name: "service1", disable: true }
    - { name: "service2", disable: false }
  По умолчанию: не определено (сервисы не управляются)

disable_systemd_resolved: |
  Отключить systemd-resolved
  По умолчанию: false

disable_selinux: |
  Отключить SELinux
  По умолчанию: false

disable_apparmor: |
  Отключить AppArmor
  По умолчанию: false

apparmor_disable: |
  Отключить AppArmor (альтернативное название)
  По умолчанию: false

# Переменные для роли 11_certificates
certificates_configure: |
  Включить настройку сертификатов
  По умолчанию: false (сертификаты не настраиваются)

ca_certificate_url: |
  URL для скачивания CA сертификата
  По умолчанию: не определено (сертификат не скачивается)
  Пример: "https://ca.mxhash.com:8443/roots.pem"
  Для отключения можно закомментировать или поставить "#" в начале

ca_certificate_name: |
  Имя файла для сохранения CA сертификата
  По умолчанию: не определено
  Пример: "mxhash.crt", "root-ca.pem"

custom_certs_dir: |
  Путь к директории с кастомными сертификатами (относительно playbook_dir)
  По умолчанию: не определено (кастомные сертификаты не устанавливаются)
  Пример: "files/certs" или "certificates"
  Все файлы .crt и .pem из этой директории будут установлены

# Переменные для роли 12_date_timezone
timezone: |
  Часовой пояс системы
  Формат: IANA timezone (например: Europe/Moscow, America/New_York, UTC)
  По умолчанию: Europe/Moscow

ntp_servers: |
  Список NTP серверов для синхронизации времени
  Формат: список IP адресов или доменных имен
  Пример: ["192.168.1.1", "pool.ntp.org"]

# Переменные для роли 13_configure_repo
cleanup_repositories: |
  Очистить существующие репозитории перед настройкой
  По умолчанию: false (репозитории не очищаются)
  При установке в true все существующие репозитории будут удалены

install_additional_repos: |
  Настроить репозитории для системы
  По умолчанию: false (репозитории не копируются)
  При установке в true репозитории будут настроены автоматически в зависимости от типа ОС:
    - Ubuntu: ubuntu.sources
    - Debian: debian.sources
    - Oracle Linux 9: oracle9.repo
    - Oracle Linux 10: oracle10.repo

# Переменные для роли 14_install_software
install_packages: |
  Дополнительные пакеты для установки
  Формат: строка с пакетами через пробел или список
  Пример: "jq nano vim" или ["jq", "nano", "vim"]
  По умолчанию: не определено (устанавливаются только базовые пакеты)

uninstall_packages: |
  Пакеты для удаления
  Формат: строка с пакетами через пробел или список
  Пример: "package1 package2" или ["package1", "package2"]
  По умолчанию: не определено (пакеты не удаляются)

remove_snap: |
  Удалить Snap пакетный менеджер
  По умолчанию: false

remove_cloud_init: |
  Удалить cloud-init
  По умолчанию: false

# Переменные для роли 15_configure_firewall
# (если есть)

# Переменные для роли 16_configure_logging
# (если есть)

# Переменные для роли 17_update_reboot
update_now: |
  Выполнить обновление системы немедленно
  По умолчанию: false (обновление не выполняется)

update_schedule_time: |
  Время для запланированного обновления системы
  Формат: строка с временем (например: "03:00")
  По умолчанию: не определено

system_update_scheduler: |
  Настроить планировщик обновлений системы
  По умолчанию: false

reboot_system: |
  Перезагрузить систему после обновления
  По умолчанию: false (система не перезагружается)

